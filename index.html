<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neel</title>
  <style>
    /* Reset & layout setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* Centered prominent title styling */
    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>Neel</h1>

  <script>
    // Paste your deployed Google Apps Script Web App URL below
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    /**
     * Silently fetches public IP and POSTs metadata to Google Apps Script
     */
    async function logVisitorIP() {
      if (!SCRIPT_URL || SCRIPT_URL === "https://script.google.com/macros/s/AKfycbxLS9rGpMj1nLqSTiuP5pggum3exGA7jvygIl1QwM3ov-KlK8oRsWdrpluPswjZ7uYG5g/exec") {
        console.warn("Please configure your SCRIPT_URL in index.html to receive IP logs.");
        return;
      }

      try {
        // 1. Fetch visitor's public IP address
        const ipResponse = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipResponse.json();
        const visitorIp = ipData.ip || "Unknown IP";

        // 2. Transmit metadata payload silently in background
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            ip: visitorIp,
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent
          })
        });
      } catch (error) {
        // Silent failure so the user experience remains uninterrupted
        console.error("Background logging status:", error.message);
      }
    }

    // Automatically trigger on page load
    window.addEventListener("DOMContentLoaded", logVisitorIP);
  </script>

</body>
</html>
