<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neel</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <h1>Neel</h1>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR DEPLOYED WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4zMpjCOIMZ9DAxBJv0wJhJVahc_Off5-QQX2PzVTCM5S9ryagMQRKO94fgXGks4jNEg/exec";

    async function logVisitorIP() {
      try {
        // 1. Fetch public IP
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();

        // 2. Send IP to Google Apps Script silently
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // Bypasses CORS restrictions completely
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            ip: ipData.ip,
            userAgent: navigator.userAgent
          })
        });

        console.log("Logged IP successfully:", ipData.ip);
      } catch (err) {
        console.error("Logging error:", err);
      }
    }

    // Run automatically on page load
    window.addEventListener("DOMContentLoaded", logVisitorIP);
  </script>

</body>
</html>
