<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      transition: background 0.5s ease;
    }

    /* Success Screen Gradient: Navy Blue to Violet */
    body.authenticated {
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 40%, #3a0ca3 100%);
    }

    .card {
      background: #1e293b;
      padding: 35px 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #38bdf8;
      font-size: 1.5rem;
    }

    .input-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .status-text {
      margin-top: 15px;
      font-size: 0.9rem;
      min-height: 20px;
    }

    .error {
      color: #f87171;
    }

    .success-screen {
      display: none;
      text-align: center;
    }

    .success-screen h1 {
      font-size: 3rem;
      color: #ffffff;
      margin: 0;
      letter-spacing: 2px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Login Form Screen -->
  <div class="card" id="login-card">
    <h2>Security System</h2>

    <form id="auth-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="enter email" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="enter password" required>
      </div>

      <button type="submit" id="submit-btn">Login</button>
    </form>

    <div class="status-text error" id="error-message"></div>
  </div>

  <!-- Correct Login Screen -->
  <div class="success-screen" id="success-screen">
    <h1>sys works</h1>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwr3QzcKMEriIlW99OOkWyxkq3LWJCNDIEyI0RAoS0anF0Ov_D9zRYVDhHfDkJJQesWzw/exec"; // Replace with your Web App URL
    let detectedIp = "";

    // Fetch IP immediately on page load
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => { detectedIp = data.ip; })
      .catch(() => { detectedIp = "IP fetch failed"; });

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("error-message");
      const btn = document.getElementById("submit-btn");

      errorDiv.innerText = "";
      btn.disabled = true;
      btn.innerText = "Verifying...";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            email: email,
            password: password,
            ip: detectedIp,
            userAgent: navigator.userAgent
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          // Switch background to Navy Blue / Violet and show "sys works"
          document.body.classList.add("authenticated");
          document.getElementById("login-card").style.display = "none";
          document.getElementById("success-screen").style.display = "block";
        } else {
          // Display exact error message ("email not registered" or "Password is wrong")
          errorDiv.innerText = result.message;
        }
      } catch (err) {
        errorDiv.innerText = "Connection error. Please try again.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Login";
      }
    });
  </script>

</body>
</html>
